name: Build Revanta Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/revanta-final-app
    paths:
      - ".github/workflows/build-revanta-apk.yml"
      - "admin-app/**"
      - "src/pages/dashboard.mjs"
      - "api/**"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Prepare Revanta Android app
        working-directory: admin-app
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6
          mkdir -p www
          printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a2d"><title>Revanta</title></head><body style="margin:0;background:#101a2d;color:#fff;font:16px system-ui;display:grid;min-height:100vh;place-items:center"><p>Connecting securely to Revanta…</p></body></html>' > www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.revanta.growth",
            "appName": "Revanta",
            "webDir": "www",
            "server": {
              "url": "https://revanta.duckdns.org/dashboard",
              "cleartext": false,
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build installable APK
        working-directory: admin-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: revanta-final-android-apk
          path: admin-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
