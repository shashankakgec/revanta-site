name: Build Revanta Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/revanta-final-app
    paths:
      - ".github/workflows/build-revanta-apk.yml"
      - "admin-app/**"
      - "src/pages/dashboard.mjs"
      - "api/**"

permissions:
  contents: read

jobs:
  build-apk:
    env:
      APP_URL: ${{ github.ref == 'refs/heads/main' && 'https://revanta.duckdns.org' || 'https://revanta-site-git-feature-revanta-final-app-hello-shas.vercel.app/dashboard' }}
      REVANTA_KEYSTORE_BASE64: ${{ secrets.REVANTA_KEYSTORE_BASE64 }}
      REVANTA_KEYSTORE_PASSWORD: ${{ secrets.REVANTA_KEYSTORE_PASSWORD }}
      REVANTA_KEY_ALIAS: ${{ secrets.REVANTA_KEY_ALIAS }}
      REVANTA_KEY_PASSWORD: ${{ secrets.REVANTA_KEY_PASSWORD }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate release signing secrets
        run: |
          test -n "$REVANTA_KEYSTORE_BASE64" || (echo "Missing REVANTA_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$REVANTA_KEYSTORE_PASSWORD" || (echo "Missing REVANTA_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$REVANTA_KEY_ALIAS" || (echo "Missing REVANTA_KEY_ALIAS repository secret" && exit 1)
          test -n "$REVANTA_KEY_PASSWORD" || (echo "Missing REVANTA_KEY_PASSWORD repository secret" && exit 1)

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Smoke-test production dashboard and API
        run: |
          set -e
          for attempt in $(seq 1 18); do
            health_code=$(curl -sS -o /tmp/revanta-health.json -w '%{http_code}' https://revanta.duckdns.org/api/health || true)
            if [ "$health_code" = "200" ]; then break; fi
            echo "Waiting for Neon database health check (HTTP $health_code), attempt $attempt/18"
            sleep 10
          done
          if [ "$health_code" != "200" ] || ! grep -q '"ok":true' /tmp/revanta-health.json; then
            cat /tmp/revanta-health.json || true
            echo "Neon database health check failed (HTTP $health_code)"
            exit 1
          fi
          admin_code=$(curl -sS -o /tmp/revanta-admin.json -w '%{http_code}' https://revanta.duckdns.org/api/admin || true)
          if [ "$admin_code" != "401" ]; then
            cat /tmp/revanta-admin.json || true
            echo "Admin API should return 401 without a session; got $admin_code"
            exit 1
          fi
          lead_code=$(curl -sS -o /tmp/revanta-lead.json -w '%{http_code}' https://revanta.duckdns.org/api/lead || true)
          if [ "$lead_code" != "405" ]; then
            cat /tmp/revanta-lead.json || true
            echo "Lead API should reject GET with HTTP 405; got $lead_code"
            exit 1
          fi
          curl -fsS https://revanta.duckdns.org/dashboard -o /tmp/revanta-dashboard.html
          grep -q 'Neon Auth' /tmp/revanta-dashboard.html
          echo "Production dashboard, Neon-backed admin API, and lead endpoint are responding."

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Prepare Revanta Android app
        working-directory: admin-app
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6
          mkdir -p www
          printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a2d"><title>Revanta</title></head><body style="margin:0;background:#101a2d;color:#fff;font:16px system-ui;display:grid;min-height:100vh;place-items:center"><p>Connecting securely to Revanta…</p></body></html>' > www/index.html
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.revanta.growth",
            "appName": "Revanta",
            "webDir": "www",
            "server": {
              "url": "$APP_URL",
              "cleartext": false,
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          cat > android/app/src/main/java/com/revanta/growth/MainActivity.java <<'EOF'
          package com.revanta.growth;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private int permissionIndex = 0;
              private final String[][] permissionGroups = new String[][] {
                  {Manifest.permission.POST_NOTIFICATIONS},
                  {Manifest.permission.CAMERA},
                  {"MEDIA_GROUP"},
                  {Manifest.permission.RECORD_AUDIO},
                  {Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION},
                  {Manifest.permission.READ_CONTACTS}
              };

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      CookieManager.getInstance().setAcceptCookie(true);
                      CookieManager.getInstance().setAcceptThirdPartyCookies(getBridge().getWebView(), true);
                  }
                  permissionIndex = getPreferences(MODE_PRIVATE).getInt("permission_setup_index", 0);
                  if (!getPreferences(MODE_PRIVATE).getBoolean("permission_setup_completed", false)) {
                      getWindow().getDecorView().postDelayed(this::requestNextPermission, 900);
                  }
              }

              private String[] runtimePermissionsFor(String group) {
                  if ("MEDIA_GROUP".equals(group)) {
                      if (Build.VERSION.SDK_INT >= 34) return new String[] {
                          Manifest.permission.READ_MEDIA_IMAGES,
                          Manifest.permission.READ_MEDIA_VIDEO,
                          Manifest.permission.READ_MEDIA_VISUAL_USER_SELECTED
                      };
                      if (Build.VERSION.SDK_INT >= 33) return new String[] {
                          Manifest.permission.READ_MEDIA_IMAGES, Manifest.permission.READ_MEDIA_VIDEO
                      };
                      return new String[] {Manifest.permission.READ_EXTERNAL_STORAGE};
                  }
                  if (Build.VERSION.SDK_INT < 33 && Manifest.permission.POST_NOTIFICATIONS.equals(group)) return new String[0];
                  return new String[] {group};
              }

              private boolean allGranted(String[] permissions) {
                  if (permissions.length == 0) return true;
                  for (String permission : permissions) {
                      if (ContextCompat.checkSelfPermission(this, permission) != PackageManager.PERMISSION_GRANTED) return false;
                  }
                  return true;
              }

              private void requestNextPermission() {
                  while (permissionIndex < permissionGroups.length) {
                      String[] requested = runtimePermissionsFor(permissionGroups[permissionIndex][0]);
                      if (allGranted(requested) || requested.length == 0) {
                          permissionIndex++;
                          getPreferences(MODE_PRIVATE).edit().putInt("permission_setup_index", permissionIndex).apply();
                          continue;
                      }
                      int requestCode = 700 + permissionIndex;
                      permissionIndex++;
                      getPreferences(MODE_PRIVATE).edit().putInt("permission_setup_index", permissionIndex).apply();
                      ActivityCompat.requestPermissions(this, requested, requestCode);
                      return;
                  }
                  getPreferences(MODE_PRIVATE).edit()
                      .putBoolean("permission_setup_completed", true)
                      .putInt("permission_setup_index", permissionGroups.length)
                      .apply();
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode >= 700 && requestCode < 700 + permissionGroups.length) {
                      requestNextPermission();
                  }
              }
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
              '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />',
              '    <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" />',
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.READ_CONTACTS" />'
          ]
          for item in permissions:
              if item not in s:
                  s = s.replace('<manifest ', '<manifest ', 1)
                  marker = '<application'
                  s = s.replace(marker, '\\n'.join(permissions) + '\\n    ' + marker, 1)
                  break
          p.write_text(s)
          PY
          npx cap sync android

      - name: Configure release signing
        working-directory: admin-app/android
        run: |
          printf '%s' "$REVANTA_KEYSTORE_BASE64" | base64 --decode > app/revanta-release-key.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          signing = """
              signingConfigs {
                  release {
                      storeFile file("revanta-release-key.jks")
                      storePassword System.getenv("REVANTA_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("REVANTA_KEY_ALIAS")
                      keyPassword System.getenv("REVANTA_KEY_PASSWORD")
                  }
              }
          """
          if "signingConfigs {" not in s:
              s = s.replace("android {", "android {\n" + signing, 1)
          import re
          pattern = r"(buildTypes\s*\{\s*release\s*\{)"
          s, count = re.subn(pattern, r"\1\n            signingConfig signingConfigs.release", s, count=1)
          if count != 1:
              raise SystemExit("Could not locate the existing release build type in app/build.gradle")
          p.write_text(s)
          PY
          chmod +x gradlew

      - name: Verify keystore and passwords before Gradle
        working-directory: admin-app/android
        run: |
          set -euo pipefail
          keytool -list -keystore app/revanta-release-key.jks -storepass "$REVANTA_KEYSTORE_PASSWORD" -alias "$REVANTA_KEY_ALIAS" >/dev/null
          cp app/revanta-release-key.jks /tmp/revanta-signing-check.jks
          keytool -certreq -alias "$REVANTA_KEY_ALIAS" -keystore /tmp/revanta-signing-check.jks -storepass "$REVANTA_KEYSTORE_PASSWORD" -keypass "$REVANTA_KEY_PASSWORD" -file /tmp/revanta-signing-check.csr >/dev/null
          echo "Keystore, alias, store password, and private-key password verified."

      - name: Build signed release APK
        working-directory: admin-app/android
        run: ./gradlew assembleRelease

      - name: Verify APK signature
        working-directory: admin-app/android
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: revanta-signed-release-apk
          path: admin-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

# Signing credentials updated; rerun release validation.
